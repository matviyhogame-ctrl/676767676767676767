
name: Build Beer Visuals 2.1.0

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mod:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Fabric Mod
        shell: bash
        run: |
          if [ -f gradlew ]; then
            DIR="."
          elif [ -f mod/gradlew ]; then
            DIR="mod"
          elif [ -f beer-launcher/mod/gradlew ]; then
            DIR="beer-launcher/mod"
          else
            echo "ERROR: gradlew not found"
            exit 1
          fi

          cd "$DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BeerVisuals-2.1.0-Mod
          path: |
            **/build/libs/*.jar
          if-no-files-found: error

  build-launcher:
    name: Build Windows Launcher
    runs-on: windows-latest
    needs: build-mod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Find Launcher
        id: launcher
        shell: pwsh
        run: |
          if (Test-Path "launcher/package.json") {
            "DIR=launcher" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "beer-launcher/launcher/package.json") {
            "DIR=beer-launcher/launcher" >> $env:GITHUB_OUTPUT
          } else {
            throw "Launcher package.json not found"
          }

      - name: Install Dependencies
        working-directory: ${{ steps.launcher.outputs.DIR }}
        run: npm install --no-audit --no-fund

      - name: Build Launcher
        working-directory: ${{ steps.launcher.outputs.DIR }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BeerVisuals-2.1.0-Windows
          path: ${{ steps.launcher.outputs.DIR }}/dist/*.exe
          if-no-files-found: error
